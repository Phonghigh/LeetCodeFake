jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-1234}
  expiration: 86400000
  refresh-expiration: 604800

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leetcode_fake?options=-c%20TimeZone=UTC}
    username: ${DB_USERNAME:leetcode_app}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        highlight_sql: true


  flyway:
      # Enables or disables flyway migration execution on startup
      enabled: true
      # Locations of migration scripts (default is classpath:db/migration)
      locations: classpath:db/migration
logging:
  level:
    org.springframework.security: TRACE
    org.hibernate.SQL: DEBUG
#    org.hibernate.orm.jdbc.bind: TRACE

api:
  contextPath: "/api/v1"